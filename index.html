'use strict';
const BANK={"mc":[{"id":"I-01","topic":"Tự giác học tập","q":"Thường xuyên làm bài và học bài không cần ai nhắc nhở là biểu hiện của điều gì?","options":["Học tập tích cực, tự giác.","Quan tâm và chia sẻ.","Tự hào về truyền thống quê hương.","Giữ chữ tín."],"a":"A","why":"Tự mình chủ động học và làm bài mà không đợi nhắc nhở là học tập tự giác.","type":"mc"},{"id":"I-02","topic":"Tự giác học tập","q":"Trong học tập, nếu thiếu tính tích cực, tự giác thì dễ dẫn đến hậu quả nào?","options":["Kết quả học tập không cao, làm cha mẹ và thầy cô buồn lòng.","Vẫn lên lớp bình thường nhưng không được lãnh lương.","Vẫn hoàn thành nhiệm vụ học tập mặc dù kết quả không cao.","Vẫn có kiến thức nhưng không nhiều."],"a":"A","why":"Thiếu chủ động và cố gắng thường khiến kết quả học tập giảm sút.","type":"mc"},{"id":"I-04","topic":"Tự giác học tập","q":"Nam đi học rất sớm nhưng thường ghé quán Internet chơi game trên đường đến trường. Nhận xét nào phù hợp?","options":["Rất tích cực, tự giác trong học tập.","Siêng năng, kiên trì trong học tập.","Chưa tích cực, tự giác trong học tập.","Học tập có kế hoạch khoa học."],"a":"C","why":"Nam chưa sử dụng thời gian hợp lý và chưa tập trung cho nhiệm vụ học tập.","type":"mc"},{"id":"I-05","topic":"Tự giác học tập","q":"Bài hát “Hổng dám đâu” (SGK GDCD 7, trang 16) gửi gắm thông điệp nào liên quan đến học tập?","options":["Học tập tích cực, tự giác.","Giữ chữ tín.","Vừa chơi vừa học.","Chơi trước, học sau."],"a":"A","why":"Bài hát nhắc học sinh ưu tiên nhiệm vụ học tập và biết tự giác.","type":"mc"},{"id":"I-06","topic":"Truyền thống quê hương","q":"Người dân quyên góp quà giúp đồng bào miền Trung bị thiệt hại do bão lũ thể hiện truyền thống nào?","options":["Đoàn kết, dũng cảm.","Cần cù lao động.","Yêu nước chống ngoại xâm.","Tương thân, tương ái."],"a":"D","why":"Tương thân, tương ái là biết yêu thương, đùm bọc, giúp đỡ nhau khi khó khăn.","type":"mc"},{"id":"I-07","topic":"Truyền thống quê hương","q":"Việc làm nào thể hiện truyền thống hiếu học?","options":["Chị H thường xuyên tham gia hoạt động thiện nguyện.","Anh T vận động phát triển nghề gốm quê hương.","Ông P chăm chỉ lao động để đạt sản lượng lúa cao.","Bạn K tự giác học tập và năm nào cũng đạt thành tích cao."],"a":"D","why":"Hiếu học là coi trọng việc học, chăm chỉ và không ngừng vươn lên trong học tập.","type":"mc"},{"id":"I-08","topic":"Tự giác học tập","q":"Đâu là biểu hiện của học tập tích cực, tự giác?","options":["Lấy lý do bị bệnh để nghỉ môn học không thích.","Mượn vở bài tập của bạn để chép.","Nhờ bạn chép bài hộ.","Quyết tâm giải bài khó đến cùng mà không cần ai nhắc."],"a":"D","why":"Chủ động, kiên trì vượt khó và không phụ thuộc vào nhắc nhở là biểu hiện tích cực, tự giác.","type":"mc"},{"id":"I-10","topic":"Tự giác học tập","q":"Học tập tích cực, tự giác là gì?","options":["Chủ động thực hiện đầy đủ, hiệu quả nhiệm vụ học tập đã đề ra.","Chỉ thường xuyên chú ý đến người khác trong học tập.","Chép bài của bạn khi làm bài kiểm tra.","Nhờ bạn làm bài tập hộ để tránh bị trách phạt."],"a":"A","why":"Học sinh tự đặt mục tiêu và chủ động hoàn thành việc học bằng nỗ lực của bản thân.","type":"mc"},{"id":"I-11","topic":"Truyền thống quê hương","q":"Truyền thống quê hương được người dân tạo ra và lưu truyền như thế nào?","options":["Từ đất nước này sang đất nước khác.","Từ địa phương này sang địa phương khác.","Từ thế hệ này sang thế hệ khác.","Từ vùng này sang vùng khác."],"a":"C","why":"Nét đặc trưng của truyền thống là được gìn giữ và tiếp nối giữa các thế hệ.","type":"mc"},{"id":"I-12","topic":"Truyền thống quê hương","q":"“Những giá trị vật chất, tinh thần do người dân một vùng đất tạo ra và lưu truyền qua các thế hệ” là khái niệm nào?","options":["Truyền thống quê hương.","Truyền thống gia đình.","Phong tục tập quán.","Nét đẹp bản địa."],"a":"A","why":"Đây là nội dung khái niệm truyền thống quê hương trong đề cương.","type":"mc"},{"id":"II-01","topic":"Tự giác học tập","q":"Câu nói “Học, học nữa, học mãi” nhắc đến phẩm chất nào?","options":["Tự hào về truyền thống quê hương.","Quan tâm, cảm thông và chia sẻ.","Học tập tự giác, tích cực.","Giữ chữ tín."],"a":"C","why":"Tinh thần học tập thường xuyên, bền bỉ thể hiện sự tích cực và tự giác.","type":"mc"},{"id":"II-02","topic":"Truyền thống quê hương","q":"Truyền thống nào thể hiện lòng biết ơn công lao nuôi nấng, dạy dỗ của ông bà, cha mẹ?","options":["Dũng cảm.","Trung thực.","Hiếu thảo.","Yêu nước."],"a":"C","why":"Hiếu thảo là biết kính trọng, yêu thương, chăm sóc và biết ơn ông bà, cha mẹ.","type":"mc"},{"id":"II-03","topic":"Tự giác học tập","q":"N ngồi vào bàn học đúng giờ nhưng vẫn nhắn tin; chỉ tập trung khi bố mẹ nhắc. N là người như thế nào?","options":["Học tập có kế hoạch khoa học.","Rất tích cực, tự giác trong học tập.","Siêng năng, kiên trì trong học tập.","Chưa tích cực, tự giác trong học tập."],"a":"D","why":"Có mặt tại bàn học chưa đủ; cần thực sự tập trung và chủ động học.","type":"mc"},{"id":"II-04","topic":"Tự giác học tập","q":"Người có tính tích cực, tự giác thường được mọi người đối xử như thế nào?","options":["Xa lánh.","Tin yêu.","Giễu cợt.","Khi dễ."],"a":"B","why":"Tinh thần trách nhiệm và chủ động giúp xây dựng sự tin tưởng, quý mến.","type":"mc"},{"id":"II-05","topic":"Truyền thống quê hương","q":"Điều nào KHÔNG phải biện pháp giữ gìn, phát huy truyền thống quê hương?","options":["Tham gia các hoạt động văn hóa của quê hương.","Tham gia hoạt động đền ơn đáp nghĩa.","Kì thị sự khác biệt văn hóa giữa các vùng miền.","Kính trọng và biết ơn những người có công với quê hương."],"a":"C","why":"Kì thị các vùng miền là thái độ thiếu tôn trọng, không giúp gìn giữ những giá trị tốt đẹp.","type":"mc"},{"id":"II-06","topic":"Tự giác học tập","q":"Tích cực, tự giác học tập giúp chúng ta điều gì?","options":["Có thêm kiến thức, mở rộng hiểu biết.","Chỉ rèn luyện tình đoàn kết với người xung quanh.","Chỉ biết nhắc nhở người khác học tập.","Luôn hơn hẳn mọi người về tính cách."],"a":"A","why":"Tự giác học giúp hiểu bài, rèn năng lực và mở rộng kiến thức.","type":"mc"},{"id":"II-08","topic":"Quan tâm, chia sẻ","q":"Biểu hiện nào KHÔNG thể hiện sự chia sẻ với người khác?","options":["San sẻ với bạn khi họ khó khăn.","Cảm thông với người khác.","Thờ ơ, không đồng cảm khi người khác gặp khó khăn.","Đồng cảm khi người khác gặp khó khăn."],"a":"C","why":"Thái độ thờ ơ, vô cảm trái với quan tâm, cảm thông và chia sẻ.","type":"mc"},{"id":"II-09","topic":"Truyền thống quê hương","q":"Đâu KHÔNG phải là truyền thống tốt đẹp của quê hương?","options":["Yêu nước.","Cần cù lao động.","Làm đồ thủ công mĩ nghệ.","Hà tiện, ích kỉ."],"a":"D","why":"Hà tiện, ích kỉ là thói xấu, không phải một truyền thống cần phát huy.","type":"mc"},{"id":"II-10","topic":"Quan tâm, chia sẻ","q":"Biểu hiện nào thể hiện rõ nhất sự chia sẻ với người khác?","options":["Cảm thông với người khác.","Đồng cảm và san sẻ với người gặp khó khăn.","Đặt mình vào vị trí của người khác.","Thường xuyên chú ý đến người khác."],"a":"B","why":"Chia sẻ thể hiện rõ khi biết đồng cảm và có hành động san sẻ, giúp đỡ.","type":"mc"},{"id":"II-11","topic":"Tự giác học tập","q":"Đâu là BIỂU HIỆN của học tập tích cực, tự giác?","options":["Được mọi người tôn trọng.","Mở rộng hiểu biết, gặt hái thành công.","Có mục đích và động cơ học tập đúng đắn.","Có thêm kiến thức, mở rộng hiểu biết."],"a":"C","why":"Có mục đích, động cơ học tập đúng đắn là biểu hiện; các lựa chọn khác là kết quả hoặc lợi ích.","type":"mc"},{"id":"II-12","topic":"Truyền thống quê hương","q":"Việc làm nào thể hiện truyền thống cần cù lao động?","options":["Anh Q hào hứng tham gia nghĩa vụ quân sự.","Anh X thường bỏ cuộc khi việc nặng nhọc.","Bạn A đạt thành tích học tập cao nhờ nỗ lực.","Chị P được khen vì chăm chỉ và sáng tạo trong công việc."],"a":"D","why":"Cần cù lao động thể hiện bằng chăm chỉ, bền bỉ, có trách nhiệm với công việc.","type":"mc"}],"tf":[{"id":"T1-a","type":"tf","topic":"Quan tâm, chia sẻ","case":1,"caseTitle":"Chia sẻ mùa Trung thu","sit":"Nhân dịp Trung thu, lớp 7A quyê function readStore(){try{return JSON.parse(localStorage.getItem(storageKey))||{best:0,plays:0,mastered:0,muted:false}}catch{return {best:0,plays:0,mastered:0,muted:false}}}

function sound(good){if(saved.muted)return;try{let Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;let ctx=new Ctx();const f=good?[540,750]:[280,200];f.forEach((hz,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain(),at=ctx.currentTime+i*.105;osc.type=good?'sine':'triangle';osc.frequency.setValueAtTime(hz,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.075,at+.018);gain.gain.exponentialRampToValueAtTime(.0001,at+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+.17)});setTimeout(()=>ctx.close(),500)}catch{}}
function vibrate(good){try{navigator.vibrate?.(good?17:[45,45,45])}catch{}}

function newGame(mode,questions){return {mode,questions,i:0,score:0,correct:0,wrong:[],answered:false,chosen:null,streak:0,maxStreak:0,hearts:3,halfUsed:false,hidden:[],remaining:180,started:Date.now(),prevCorrect:false}}
function start(mode,override){stopTimer();if(mode==='essay'){essayStep=0;essayDone=new Set();essayTexts={};essayRevealed=false;renderEssay();return}let qs;
 if(override)qs=override;
 else if(mode==='quick')qs=shuffle([...shuffle(BANK.mc).slice(0,7),...shuffle(BANK.tf).slice(0,3)]);

function modeName(m){return ({quick:'Đấu trường tốc độ',mc:'Chinh phục kiến thức',tf:'Thám tử Đúng / Sai',review:'Ôn tập câu sai'})[m]||m}
function stopTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function startTimer(){stopTimer();if(game?.mode!=='quick'||game.answered)return;let t0=Date.now();let base=game.remaining;ticker=setInterval(()=>{if(!game||game.mode!=='quick')return stopTimer();if(game.answered)return stopTimer();game.remaining=Math.max(0,base-Math.floor((Date.now()-t0)/1000));updateTimer();if(game.remaining<=0){stopTimer();finish('time')}},240)}
function updateTimer(){let e=$('timer');if(!e||!game)return;let t=game.remaining;e.textContent=`⏱ ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;e.classList.toggle('danger',t<=30)}

 attachSound();$('exit').addEventListener('click',()=>{if(confirm('Về màn hình chính? Tiến trình vòng này sẽ không được lưu.'))home()});$('half').addEventListener('click',half);document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.answer)));
 if(quick){updateTimer();startTimer()}}
function half(){let g=game,q=g?.questions[g.i];if(!g||g.answered||q.type!=='mc'||g.halfUsed)return;g.halfUsed=true;let bad=shuffle(letters.filter(x=>x!==q.a)).slice(0,2);g.hidden=bad;document.querySelectorAll('.answer').forEach(b=>{if(bad.includes(b.dataset.answer))b.classList.add('hidden-choice')});$('half').disabled=true;$('half').innerText='💡 Đã dùng 50:50'}
function choose(selected){let g=game;if(!g||g.answered)return;const q=g.questions[g.i],ans=q.type==='tf'?(selected==='true'):selected;g.answered=true;g.chosen=selected;let right=ans===q.a;g.prevCorrect=right;stopTimer();if(right){g.correct++;g.streak++;g.maxStreak=Math.max(g.maxStreak,g.streak);g.score+=100+(g.streak>=3?25:0)}else{g.wrong.push({q,selected});g.streak=0;if(g.mode==='quick')g.hearts=Math.max(0,g.hearts-1)}sound(right);vibrate(right);
 document.querySelectorAll('.answer').forEach(b=>{let thisAns=q.type==='tf'?(b.dataset.answer==='true'):b.dataset.answer;let correctChoice=thisAns===q.a;let selectedChoice=b.dataset.answer===selected;b.disabled=true;b.classList.remove('hidden-choice');if(correctChoice)b.classList.add('correct');else if(selectedChoice)b.classList.add('wrong');else b.classList.add('muted');let mark=b.querySelector('.mark');if(correctChoice)mark.textContent='✓';else if(selectedChoice)mark.textContent='✕'});
 if($('points'))$('points').textContent=g.score;
 $('feedback').innerHTML=`<div class="feedback ${right?'':'bad'}"><div class="feedback-title">${right?'🎉 Chính xác! Tuyệt lắm!':`💪 Chưa đúng, mình học thêm nhé!`}${right&&g.streak>=3?' 🔥 COMBO +25':''}</div><p>${esc(q.why)}</p></div>`;
 const ended=g.mode==='quick'&&g.hearts<=0;
 $('nextslot').innerHTML=`<button class="primary" id="next">${ended?'Xem thành tích':(g.i===g.questions.length-1?'Hoàn thành vòng chơi':'Câu tiếp theo')+' →'}</button>`;
 $('next').addEventListener('click',()=>{if(ended)return finish('hearts');g.i++;g.answered=false;g.chosen=null;g.hidden=[];if(g.i>=g.questions.length)finish('done');else renderQuiz()});}
function finish(reason){if(!game)return;stopTimer();const g=game,total=g.questions.length,answered=g.correct+g.wrong.length,acc=answered?Math.round(g.correct/answered*100):0;
 saved.plays++;if(g.score>saved.best)saved.best=g.score;if(acc>saved.mastered)saved.mastered=acc;save();
 let pct=answered?Math.round(g.correct/answered*100):0;
 const badge=pct>=90?'🏆 BẬC THẦY CÔNG DÂN':pct>=70?'🌟 NGÔI SAO HIỂU BIẾT':pct>=50?'🌱 NHÀ THÁM HIỂM BỀN BỈ':'🚀 DŨNG SĨ KHÔNG BỎ CUỘC';
 const emoji=pct>=90?'🏆':pct>=70?'🥳':pct>=50?'💪':'🌱';
 let comment=pct>=90?'Bạn hiểu bài rất vững! Cùng giữ phong độ nhé.':pct>=70?'Rất khá! Ôn thêm vài câu sai là bứt phá ngay.':pct>=50?'Bạn đã có nền tảng. Chơi lại để tiến bộ hơn nhé.':'Mỗi lần luyện tập là một bước tiến. Bạn làm được!';
 let topicCounts={};g.questions.slice(0,answered).forEach(q=>{let t=topicCounts[q.topic]||(topicCounts[q.topic]={count:0,right:0});t.count++});g.questions.slice(0,answered).forEach(q=>{if(!g.wrong.some(w=>w.q.id===q.id))topicCounts[q.topic].right++});
 const why=reason==='time'?'⏰ Hết 3 phút!':'hearts'===reason?'❤️ Đã dùng hết 3 trái tim!':answered<total?'Vòng chơi kết thúc!':'Bạn đã hoàn thành vòng chơi!';
 $('app').innerHTML=htmlHeader()+`<div class="result-head"><div class="result-emoji">${emoji}</div><h1>${esc(badge)}</h1><p>${esc(why)} ${esc(comment)}</p><div class="result-score">${g.score.toLocaleString('vi-VN')} <small>điểm</small></div><span class="badge-chip">🔥 Chuỗi đúng dài nhất: ${g.maxStreak}</span></div>
 <div class="results-stats"><div class="mini-stat"><b>${g.correct}/${answered}</b><span>Trả lời đúng</span></div><div class="mini-stat"><b>${acc}%</b><span>Độ chính xác</span></div><div class="mini-stat"><b>${g.wrong.length}</b><span>Cần ôn thêm</span></div></div>
 <div class="review-panel"><h3>📊 Kết quả theo chủ đề</h3>${Object.entries(topicCounts).map(([name,t])=>{let v=Math.round(t.right/t.count*100);return `<div class="topic-row"><span>${topicKey[name]||'📘'} ${esc(name)}</span><span>${t.right}/${t.count} · ${v}%</span></div><div class="mini-progress"><div style="width:${v}%"></div></div>`}).join('')||'<p>Chưa có lượt trả lời.</p>'}</div>
 ${g.wrong.length?`<div class="review-panel"><h3>📖 Những câu nên ôn lại (${g.wrong.length})</h3>${g.wrong.slice(0,10).map(({q},i)=>`<div class="mistake"><strong>${i+1}. ${esc(q.q)}</strong><span class="right">Đáp án: ${q.type==='tf'?(q.a?'Đúng':'Sai'):`${q.a}. ${esc(q.options[letters.indexOf(q.a)])}`}</span><div>${esc(q.why)}</div></div>`).join('')}${g.wrong.length>10?`<div style="font-size:12px;color:#7c8fa1;margin-top:10px">Còn ${g.wrong.length-10} câu sai khác, bấm “Ôn lại câu sai” để luyện đủ.</div>`:''}</div>`:''}
 <button class="primary" id="again">🔁 Chơi lại vòng này</button>${g.wrong.length?`<button class="secondary" id="review">📚 Ôn lại ${g.wrong.length} câu sai</button>`:''}<button class="secondary share" id="share">📤 Chia sẻ thành tích</button><button class="secondary" id="gohome">🏠 Chọn màn chơi khác</button><div class="footer-brand">HỌC CHĂM • CHƠI VUI • TIẾN BỘ MỖI NGÀY</div>`;
 attachSound();$('again').addEventListener('click',()=>start(g.mode==='review'?'quick':g.mode));let review=$('review');if(review)review.addEventListener('click',()=>start('review',g.wrong.map(x=>x.q)));$('gohome').addEventListener('click',home);$('share').addEventListener('click',async()=>{let msg=`Mình vừa đạt ${g.score} điểm (${g.correct}/${answered} đúng) trong mini game Hành trình Công dân 7! 🎓`;try{if(navigator.share)await navigator.share({title:'Hành trình Công dân 7',text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);$('share').textContent='✅ Đã sao chép thành tích!'}else{window.prompt('Sao chép thành tích của bạn:',msg)}}catch{}});
 if(pct>=70&&reason!=='time')confetti();}
function renderEssay(){stopTimer();const e=BANK.essays[essayStep];if(!e){renderEssayEnd();return}
 $('app').innerHTML=htmlHeader()+`<div class="game-top"><button class="back" id="exit" aria-label="Về trang chủ">‹</button><div class="game-label"><b>Bậc thầy ứng xử</b><span>Viết ý của mình, sau đó đối chiếu gợi ý</span></div><div class="game-points">💬 ${essayDone.size}/5</div></div>
 <div class="game-status"><span class="counter">Thẻ ${essayStep+1} / 5</span><span class="right-side">✏️ Không chấm điểm</span></div><div class="progress"><div class="progress-fill" style="width:${essayStep/5*100}%"></div></div>
 <section class="question-card"><span class="topic ${topicClass(e.tag)}">${topicKey[e.tag]} ${esc(e.tag)}</span><h2>🎯 ${esc(e.title)}</h2><p style="font-size:14px;color:#4c6175;line-height:1.72">${esc(e.q)}</p><p class="essay-note">✍️ Thử viết 2–4 ý của em trước khi xem đáp án gợi ý.</p><textarea id="essay-answer" class="essay-input" placeholder="Em sẽ trả lời như thế nào?">${esc(essayTexts[essayStep]||'')}</textarea><div id="guidearea">${essayRevealed?essayGuide(e):''}</div><button class="secondary" id="reveal">${essayRevealed?'🙈 Ẩn gợi ý':'💡 Xem gợi ý trả lời'}</button><button class="primary" id="essay-next">${essayStep===4?'✅ Hoàn thành 5 thẻ':'Mình đã hiểu • Thẻ tiếp theo →'}</button></section>
 <div class="footnote">Gợi ý tự luận do trò chơi biên soạn để luyện tập; học sinh có thể diễn đạt khác nếu đúng ý, phù hợp tình huống.</div>`;
 attachSound();$('exit').addEventListener('click',()=>{if(confirm('Về màn hình chính? Các câu tự luận đã viết có thể bị mất.'))home()});$('essay-answer').addEventListener('input',e=>essayTexts[essayStep]=e.target.value);$('reveal').addEventListener('click',()=>{essayRevealed=!essayRevealed;$('guidearea').innerHTML=essayRevealed?essayGuide(e):'';$('reveal').textContent=essayRevealed?'🙈 Ẩn gợi ý':'💡 Xem gợi ý trả lời'});$('essay-next').addEventListener('click',()=>{essayTexts[essayStep]=$('essay-answer').value;essayDone.add(essayStep);essayStep++;essayRevealed=false;renderEssay();window.scrollTo({top:0,behavior:'smooth'})})}
function essayGuide(e){return `<div class="guide"><strong>🌷 Những ý có thể trình bày:</strong><ul>${e.guide.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
function renderEssayEnd(){$('app').innerHTML=htmlHeader()+`<div class="finished-essay"><span>🎓</span><h2>Hoàn thành 5 thẻ!</h2><p>Bạn đã luyện tập những tình huống về học tập tự giác, sự quan tâm và truyền thống quê hương. Giỏi lắm!</p></div><button class="primary" id="again">🔁 Ôn tự luận một lần nữa</button><button class="secondary" id="gohome">🏠 Về chọn màn chơi</button>`;attachSound();$('again').addEventListener('click',()=>start('essay'));$('gohome').addEventListener('click',home);confetti()}
function confetti(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;let canvas=$('confetti'),ctx=canvas.getContext('2d'),w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;let particles=Array.from({length:95},()=>({x:Math.random()*w,y:-Math.random()*h*.5,dx:(Math.random()-.5)*3,dy:2+Math.random()*4,r:3+Math.random()*5,a:Math.random()*6,c:['#10c3ab','#ffcb60','#ff7b8b','#7764ec','#ffffff'][Math.floor(Math.random()*5)]}));let start=performance.now();function frame(now){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.a+=.07;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.7);ctx.restore()});if(now-start<2700)requestAnimationFrame(frame);else ctx.clearRect(0,0,w,h)}requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(e.target?.tagName==='TEXTAREA')return;if(game&&!game.answered){let q=game.questions[game.i];if(q.type==='mc'&&'1234'.includes(e.key)){let b=document.querySelectorAll('.answer')[Number(e.key)-1];if(b&&!b.classList.contains('hidden-choice'))choose(letters[Number(e.key)-1])}else if(q.type==='tf'&&['1','2'].includes(e.key))choose(e.key==='1'?'true':'false')}else if(game&&game.answered&&e.key==='Enter')$('next')?.click()});
home();
</script>
