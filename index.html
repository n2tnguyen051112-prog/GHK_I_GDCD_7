/* Đúng/Sai: hiển thị trọn vẹn 4 nhận định của mỗi tình huống */
.case-guide{font-size:12px;color:#546e80;margin:16px 0 10px;line-height:1.6}
.case-statements{display:grid;gap:12px;margin-top:14px}
.case-item{border:1px solid #dee9f3;border-radius:17px;padding:14px;background:#f9fbfe}
.case-line{display:flex;align-items:flex-start;gap:10px;line-height:1.5;font-size:13.5px;font-weight:720;color:#203e56}
.case-letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:#e6e9ff;color:#604bba;font-size:14px;font-weight:950}
.case-text{padding-top:4px;flex:1;min-width:0}
.case-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.case-choice{padding:11px 8px;border:2px solid #dbe8f1;border-radius:12px;background:#fff;font-size:13px;font-weight:850;color:#476173;min-height:45px;transition:background .15s,border-color .15s}
.case-choice.selected{color:#124c99;background:#e6f1ff;border-color:#3981da;box-shadow:0 0 0 1px #3981da22}
.case-choice.is-correct{border-color:#28bc86;background:#dff8ed;color:#087c56}
.case-choice.is-wrong{border-color:#ee858d;background:#fff0f1;color:#bd394a}
.case-choice:disabled{opacity:1}
.case-item.item-correct{border-color:#94e0bd;background:#f3fcf7}
.case-item.item-wrong{border-color:#ffd0d0;background:#fffbfa}
.case-explanation{margin-top:11px;padding:10px 11px;background:#fff;border-radius:11px;border:1px solid #e6edf3;font-size:12px;line-height:1.6;color:#4a6374}
.case-explanation strong{display:block;color:#0c6571;margin-bottom:3px;font-weight:900}
.case-explanation span{display:block}
.case-counter{font-size:12px;color:#527282;text-align:center;margin:16px 0 0;font-weight:850}
.primary:disabled{opacity:.47;cursor:not-allowed;box-shadow:none}
.essay-question{font-size:14px;color:#4c6175;line-height:1.72;white-space:pre-line}
@media(max-width:365px){.case-item{padding:11px}.case-line{font-size:12.5px}.case-choices{gap:7px}.case-choice{padding:10px 6px}}

ns":["Tự hào về truyền thống quê hương.","Quan tâm, cảm thông và chia sẻ.","Học tập tự giác, tích cực.","Giữ chữ tín."],"a":"C","why":"Tinh thần học tập thường xuyên, bền bỉ thể hiện sự tích cực và tự giác.","type":"mc"},{"id":"II-02","topic":"Truyền thống quê hương","q":"Truyền thống nào thể hiện lòng biết ơn công lao nuôi nấng, dạy dỗ của ông bà, cha mẹ?","options":["Dũng cảm.","Trung thực.","Hiếu thảo.","Yêu nước."],"a":"C","why":"Hiếu thảo là biết kính trọng, yêu thương, chăm sóc và biết ơn ông bà, cha mẹ.","type":"mc"},{"id":"II-03","topic":"Tự giác học tập","q":"N ngồi vào bàn học đúng giờ nhưng vẫn nhắn tin; chỉ tập trung khi bố mẹ nhắc. N là người như thế nào?","options":["Học tập có kế hoạch khoa học.","Rất tích cực, tự giác trong học tập.","Siêng năng, kiên trì trong học tập.","Chưa tích cực, tự giác trong học tập."],"a":"D","why":"Có mặt tại bàn học chưa đủ; cần thực sự tập trung và chủ động học.","type":"mc"},{"id":"II-04","topic":"Tự giác học tập","q":"Người có tính tích cực, tự giác thường được mọi người đối xử như thế nào?","options":["Xa lánh.","Tin yêu.","Giễu cợt.","Khi dễ."],"a":"B","why":"Tinh thần trách nhiệm và chủ động giúp xây dựng sự tin tưởng, quý mến.","type":"mc"},{"id":"II-05","topic":"Truyền thống quê hương","q":"Điều nào KHÔNG phải biện pháp giữ gìn, phát huy truyền thống quê hương?","options":["Tham gia các hoạt động văn hóa của quê hương.","Tham gia hoạt động đền ơn đáp nghĩa.","Kì thị sự khác biệt văn hóa giữa các vùng miền.","Kính trọng và biết ơn những người có công với quê hương."],"a":"C","why":"Kì thị các vùng miền là thái độ thiếu tôn trọng, không giúp gìn giữ những giá trị tốt đẹp.","type":"mc"},{"id":"II-06","topic":"Tự giác học tập","q":"Tích cực, tự giác học tập giúp chúng ta điều gì?","options":["Có thêm kiến thức, mở rộng hiểu biết.","Chỉ rèn luyện tình đoàn kết với người xung quanh.","Chỉ biết nhắc nhở người khác học tập.","Luôn hơn hẳn mọi người về tính cách."],"a":"A","why":"Tự giác học giúp hiểu bài, rèn năng lực và mở rộng kiến thức.","type":"mc"},{"id":"II-08","topic":"Quan tâm, chia sẻ","q":"Biểu hiện nào KHÔNG thể hiện sự chia sẻ với người khác?","options":["San sẻ với bạn khi họ khó khăn.","Cảm thông với người khác.","Thờ ơ, không đồng cảm khi người khác gặp khó khăn.","Đồng cảm khi người khác gặp khó khăn."],"a":"C","why":"Thái độ thờ ơ, vô cảm trái với quan tâm, cảm thông và chia sẻ.","type":"mc"},{"id":"II-09","topic":"Truyền thống quê hương","q":"Đâu KHÔNG phải là truyền thống tốt đẹp của quê hương?","options":["Yêu nước.","Cần cù lao động.","Làm đồ thủ công mĩ nghệ.","Hà tiện, ích kỉ."],"a":"D","why":"Hà tiện, ích kỉ là thói xấu, không phải một truyền thống cần phát huy.","type":"mc"},{"id":"II-10","topic":"Quan tâm, chia sẻ","q":"Biểu hiện nào thể hiện rõ nhất sự chia sẻ với người khác?","options":["Cảm thông với người khác.","Đồng cảm và san sẻ với người gặp khó khăn.","Đặt mình vào vị trí của người khác.","Thường xuyên chú ý đến người khác."],"a":"B","why":"Chia sẻ thể hiện rõ khi biết đồng cảm và có hành động san sẻ, giúp đỡ.","type":"mc"},{"id":"II-11","topic":"Tự giác học tập","q":"Đâu là BIỂU HIỆN của học tập tích cực, tự giác?","options":["Được mọi người tôn trọng.","Mở rộng hiểu biết, gặt hái thành công.","Có mục đích và động cơ học tập đúng đắn.","Có thêm kiến thức, mở rộng hiểu biết."],"a":"C","why":"Có mục đích, động cơ học tập đúng đắn là biểu hiện; các lựa chọn khác là kết quả hoặc lợi ích.","type":"mc"},{"id":"II-12","topic":"Truyền thống quê hương","q":"Việc làm nào thể hiện truyền thống cần cù lao động?","options":["Anh Q hào hứng tham gia nghĩa vụ quân sự.","Anh X thường bỏ cuộc khi việc nặng nhọc.","Bạn A đạt thành tích học tập cao nhờ nỗ lực.","Chị P được khen vì chăm chỉ và sáng tạo trong công việc."],"a":"D","why":"Cần cù lao động thể hiện bằng chăm chỉ, bền bỉ, có trách nhiệm với công việc.","type":"mc"}],"tf":[{"id":"T1-a","type":"tf","topic":"Quan tâm, chia sẻ","case":1,"caseTitle":"Chia sẻ mùa Trung thu","sit":"Nhân dịp Trung thu, lớp 7A tổ chức quyên góp mua quà tặng trẻ em mồ côi. Một số bạn rất nhiệt tình tham gia, nhưng Nam nói: “Mình nghèo, không giúp được thì thôi, không cần quan tâm.”","q":"Việc lớp 7A quyên góp quà là biểu hiện quan tâm, chia sẻ.","a":true,"why":"Quyên góp để giúp trẻ em khó khăn là một hành động chia sẻ."},{"id":"T1-b","type":"tf","topic":"Quan tâm, chia sẻ","case":1,"caseTitle":"Chia sẻ mùa Trung thu","sit":"Nhân dịp Trung thu, lớp 7A tổ chức quyên góp mua quà tặng trẻ em mồ côi. Một số bạn rất nhiệt tình tham gia, nhưng Nam nói: “Mình nghèo, không giúp được thì thôi, không cần quan tâm.”","q":"Lý do của Nam cho thấy Nam đã quan tâm đến trẻ em mồ côi.","a":false,"why":"Câu nói của Nam thể hiện sự thờ ơ, chưa quan tâm đến người khác."},{"id":"T1-c","type":"tf","topic":"Quan tâm, chia sẻ","case":1,"caseTitle":"Chia sẻ mùa Trung thu","sit":"Nhân dịp Trung thu, lớp 7A tổ chức quyên góp mua quà tặng trẻ em mồ côi. Một số bạn rất nhiệt tình tham gia, nhưng Nam nói: “Mình nghèo, không giúp được thì thôi, không cần quan tâm.”","q":"Không nhất thiết phải giàu có mới có thể chia sẻ, vì có thể chia sẻ bằng tình cảm, sự động viên.","a":true,"why":"Lắng nghe, động viên, giúp trong khả năng đều là cách chia sẻ."},{"id":"T1-d","type":"tf","topic":"Quan tâm, chia sẻ","case":1,"caseTitle":"Chia sẻ mùa Trung thu","sit":"Nhân dịp Trung thu, lớp 7A tổ chức quyên góp mua quà tặng trẻ em mồ côi. Một số bạn rất nhiệt tình tham gia, nhưng Nam nói: “Mình nghèo, không giúp được thì thôi, không cần quan tâm.”","q":"Hoạt động quyên góp mang ý nghĩa lan tỏa tình thương trong cộng đồng.","a":true,"why":"Việc làm nhân ái có thể khơi dậy tình thương trong cộng đồng."},{"id":"T2-a","type":"tf","topic":"Quan tâm, chia sẻ","case":2,"caseTitle":"Hướng về vùng lũ","sit":"Trong đợt lũ lụt ở miền Trung, trường em phát động phong trào “Hướng về đồng bào vùng lũ”. Các bạn tham gia ủng hộ quần áo, sách vở. Một bạn lại nói: “Mấy việc này phiền phức, lo học cho mình là được.”","q":"Quyên góp giúp đỡ đồng bào vùng lũ là biểu hiện của chưa biết chia sẻ.","a":false,"why":"Quyên góp giúp người bị thiên tai chính là biểu hiện của chia sẻ."},{"id":"T2-b","type":"tf","topic":"Quan tâm, chia sẻ","case":2,"caseTitle":"Hướng về vùng lũ","sit":"Trong đợt lũ lụt ở miền Trung, trường em phát động phong trào “Hướng về đồng bào vùng lũ”. Các bạn tham gia ủng hộ quần áo, sách vở. Một bạn lại nói: “Mấy việc này phiền phức, lo học cho mình là được.”","q":"Nói “lo học cho mình là được” là suy nghĩ ích kỉ, thiếu cảm thông.","a":true,"why":"Chỉ nghĩ đến bản thân, gạt bỏ khó khăn của người khác là thiếu cảm thông."},{"id":"T2-c","type":"tf","topic":"Quan tâm, chia sẻ","case":2,"caseTitle":"Hướng về vùng lũ","sit":"Trong đợt lũ lụt ở miền Trung, trường em phát động phong trào “Hướng về đồng bào vùng lũ”. Các bạn tham gia ủng hộ quần áo, sách vở. Một bạn lại nói: “Mấy việc này phiền phức, lo học cho mình là được.”","q":"Quan tâm, chia sẻ giúp gắn kết mọi người, lan tỏa tình thương.","a":true,"why":"Giúp đỡ nhau tạo sự gắn bó và lan tỏa tình thương."},{"id":"T2-d","type":"tf","topic":"Quan tâm, chia sẻ","case":2,"caseTitle":"Hướng về vùng lũ","sit":"Trong đợt lũ lụt ở miền Trung, trường em phát động phong trào “Hướng về đồng bào vùng lũ”. Các bạn tham gia ủng hộ quần áo, sách vở. Một bạn lại nói: “Mấy việc này phiền phức, lo học cho mình là được.”","q":"Chỉ cần quyên góp tiền bạc mới được coi là chia sẻ.","a":false,"why":"Chia sẻ có thể bằng lời nói, vật dụng, thời gian hoặc việc làm, không chỉ bằng tiền."},{"id":"T3-a","type":"tf","topic":"Tự giác học tập","case":3,"caseTitle":"Chủ động phát biểu","sit":"Trong lớp, khi cô giáo đặt câu hỏi, Lan chủ động giơ tay phát biểu ý kiến. Nhưng Nam lại nói: “Không cần phát biểu đâu, chỉ cần ngồi im nghe là được.”","q":"Lan chủ động phát biểu là biểu hiện của học tập tích cực.","a":true,"why":"Chủ động xây dựng bài là một cách học tập tích cực."},{"id":"T3-b","type":"tf","topic":"Tự giác học tập","case":3,"caseTitle":"Chủ động phát biểu","sit":"Trong lớp, khi cô giá ng không hiểu bài nên đã nhờ thầy cô và bạn bè giải thích lại. Sau đó, Hùng về nhà làm thêm nhiều bài tập để luyện tập.","q":"Khi không hiểu bài mà im lặng, không hỏi, sẽ giúp học tốt hơn.","a":false,"why":"Nếu không hiểu, cần mạnh dạn hỏi hoặc tìm cách làm rõ, thay vì im lặng."},{"id":"T4-d","type":"tf","topic":"Tự giác học tập","case":4,"caseTitle":"Hùng vượt bài khó","sit":"Trong tiết Toán, Hùng không hiểu bài nên đã nhờ thầy cô và bạn bè giải thích lại. Sau đó, Hùng về nhà làm thêm nhiều bài tập để luyện tập.","q":"Biết chủ động học hỏi giúp Hùng tiến bộ nhanh.","a":true,"why":"Chủ động học hỏi và rèn luyện thường giúp tiến bộ."},{"id":"T5-a","type":"tf","topic":"Quan tâm, chia sẻ","case":5,"caseTitle":"Thăm bạn bị ốm","sit":"Trong lớp 7B có bạn Hùng bị ốm phải nghỉ học một tuần. Biết chuyện, một số bạn đã đến nhà thăm, chép bài giúp Hùng. Nhưng cũng có vài bạn trong lớp chọc ghẹo rằng: “Ốm suốt thế thì làm sao học nổi.” Trong khi đó, Nam – bạn thân của Hùng – lại nghĩ: “Đó là việc riêng của Hùng, mình không cần quan tâm.”","q":"Hành động của các bạn đến thăm và chép bài giúp Hùng là biểu hiện chưa biết quan tâm, cảm thông và chia sẻ.","a":false,"why":"Thăm hỏi và giúp bạn bị ốm là hành động quan tâm, chia sẻ."},{"id":"T5-b","type":"tf","topic":"Quan tâm, chia sẻ","case":5,"caseTitle":"Thăm bạn bị ốm","sit":"Trong lớp 7B có bạn Hùng bị ốm phải nghỉ học một tuần. Biết chuyện, một số bạn đã đến nhà thăm, chép bài giúp Hùng. Nhưng cũng có vài bạn trong lớp chọc ghẹo rằng: “Ốm suốt thế thì làm sao học nổi.” Trong khi đó, Nam – bạn thân của Hùng – lại nghĩ: “Đó là việc riêng của Hùng, mình không cần quan tâm.”","q":"Việc một số bạn chọc ghẹo Hùng là thể hiện sự cảm thông với bạn.","a":false,"why":"Chọc ghẹo khi bạn đang khó khăn là thiếu cảm thông."},{"id":"T5-c","type":"tf","topic":"Quan tâm, chia sẻ","case":5,"caseTitle":"Thăm bạn bị ốm","sit":"Trong lớp 7B có bạn Hùng bị ốm phải nghỉ học một tuần. Biết chuyện, một số bạn đã đến nhà thăm, chép bài giúp Hùng. Nhưng cực, sáng tạo.","a":true,"why":"Ngoại khóa giúp rèn tính chủ động, tích cực và sáng tạo."}],"essays":[{"title":"Một ngày biết quan tâm","tag":"Quan tâm, chia sẻ","q":"Theo em, học sinh cần làm gì để rèn luyện phẩm chất quan tâm, cảm thông và chia sẻ trong học tập và cuộc sống hằng ngày?","guide":["Quan sát, lắng nghe, tìm hiểu hoàn cảnh của người khác; biết đặt mình vào vị trí của họ và tôn trọng cảm xúc của họ.","Hỏi thăm, động viên, an ủi bạn bè, người thân khi gặp khó khăn; giúp đỡ trong khả năng như giảng bài, ghi chép bài cho bạn bị ốm.","Chia sẻ đồ dùng, thời gian, công sức phù hợp; tham gia hoạt động thiện nguyện; không chọc ghẹo, kì thị hoặc thờ ơ khi người khác cần giúp đỡ.","Nêu việc làm cụ thể em có thể thực hiện ở lớp, ở nhà hoặc trong khu dân cư."]},{"title":"Làng gốm quê hương","tag":"Truyền thống quê hương","q":"Trong buổi sinh hoạt lớp, cô giáo đề nghị mỗi học sinh giới thiệu một nét truyền thống tốt đẹp của quê hương. Mai chia sẻ về làng nghề gốm của quê em, còn Bình nói: “Những chuyện này lỗi thời rồi, nói ra xấu hổ thêm.”\n\na) Em có đồng tình với suy nghĩ của Bình không? Vì sao?\nb) Qua tình huống này, em rút ra bài học gì?","guide":["a) Không đồng tình với Bình. Làng nghề gốm là truyền thống nghề nghiệp và nét văn hóa đặc trưng của quê hương, chứa đựng kinh nghiệm, công sức của nhiều thế hệ; không nên chê bai là “lỗi thời”.","b) Cần tìm hiểu, trân trọng, tự hào và giới thiệu truyền thống tốt đẹp của quê hương; tham gia gìn giữ, phát huy các giá trị phù hợp với đời sống hôm nay.","Bài học ứng xử: tôn trọng nét đẹp văn hóa của các vùng miền, góp ý lịch sự khi có quan điểm khác biệt."]},{"title":"Lan tỏa yêu thương","tag":"Quan tâm, chia sẻ","q":"Vì sao chúng ta cần quan tâm, cảm thông và chia sẻ với người khác? Hãy nêu một ví dụ em chứng kiến hoặc tham gia.","guide":["Chúng ta cần quan tâm, cảm thông, chia sẻ để người gặp khó khăn được động viên, hỗ trợ, có thêm niềm tin vượt qua thử thách.","Sự quan tâm và sẻ chia tạo nên các mối quan hệ tốt đẹp, gắn kết tập thể và lan tỏa tinh thần tương thân, tương ái.","Ví dụ em có thể nêu: đến thăm, chép bài giúp bạn bị ốm; quyên góp sách vở cho học sinh khó khăn; an ủi bạn khi gia đình gặp chuyện buồn. Hãy kể rõ việc em đã thấy hoặc đã tham gia."]},{"title":"Tự hào truyền thống","tag":"Truyền thống quê hương","q":"Ở trường, lớp 7A tổ chức sinh hoạt chủ đề “Tự hào về truyền thống quê hương”. Khi đến lượt mình, Nam nói: “Em nghĩ truyền thống quê hương không quan trọng lắm, bây giờ chỉ cần học giỏi và có việc làm tốt thôi.”\n\na) Em có đồng ý với ý kiến của Nam không? Vì sao?\nb) Nếu em là bạn của Nam, em sẽ nói gì với bạn?","guide":["a) Không đồng ý. Học giỏi và có việc làm tốt là mục tiêu cần thiết, nhưng truyền thống quê hương còn giúp mỗi người hiểu nguồn cội, giữ gìn bản sắc và bồi đắp lòng biết ơn, tự hào.","b) Em sẽ nói với Nam: “Chúng mình vừa cần học tốt, vừa nên tìm hiểu, trân trọng và góp phần gìn giữ truyền thống quê hương. Những điều đó không hề mâu thuẫn nhau.”","Có thể bắt đầu từ việc tìm hiểu di tích, nghề truyền thống, tham gia hoạt động tri ân và giới thiệu nét đẹp quê hương."]},{"title":"Học đều các môn","tag":"Tự giác học tập","q":"B rất thích môn tiếng Anh nên thường xuyên mang sách tiếng Anh ra làm bài tập trong các giờ học khác. B cho rằng: “Môn học này rất quan trọng trong thời kỳ hội nhập, các môn học còn lại là môn phụ nên chỉ cần biết là đủ.”\n\na) Em có nhận xét gì về cách học của bạn B trong tình huống trên?\nb) Nếu là bạn của B, em sẽ khuyên bạn như thế nào?","guide":["a) B có ý thức học tiếng Anh, nhưng cách học chưa phù hợp: thiếu tập trung và tôn trọng các môn học khác, chưa tích cực, tự giác thực hiện đầy đủ nhiệm vụ học tập ở từng môn.","b) Em sẽ khuyên B học tiếng Anh đúng thời gian, chú ý nghe giảng và thực hiện bài tập của từng môn; lập thời gian biểu cân đối, không coi nhẹ môn học nào.","Học tập tích cực, tự giác cần có mục tiêu và kế hoạch phù hợp, học đều và phát huy thế mạnh của bản thân."]}],"source":"Đề cương ôn tập giữa học kì I, môn Giáo dục công dân 7, năm học 2026–2027, Trường THCS Vĩnh An","excluded":["Phần I, nhóm đầu câu 3: nhiều lựa chọn đều thể hiện quan tâm/chia sẻ.","Phần I, nhóm đầu câu 9: nhiều lựa chọn đều có thể xem là quan tâm.","Phần I, nhóm thứ hai câu 7: cả B và C đều có thể là quan điểm không đúng."]};
const $=id=>document.getElementById(id);
const storageKey='congdan7-2026-game-v1';
const topicKey={'Tự giác học tập':'⚡','Truyền thống quê hương':'🏡','Quan tâm, chia sẻ':'💗'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letters=['A','B','C','D'];
const shuffle=arr=>{arr=[...arr];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
function readStore(){try{return JSON.parse(localStorage.getItem(storageKey))||{best:0,plays:0,mastered:0,muted:false}}catch{return {best:0,plays:0,mastered:0,muted:false}}}
let saved=readStore(),game=null,ticker=null,essayStep=0,essayDone=new Set(),essayTexts={},essayRevealed=false;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch{}}
function sound(good){if(saved.muted)return;try{let Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;let ctx=new Ctx();const f=good?[540,750]:[280,200];f.forEach((hz,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain(),at=ctx.currentTime+i*.105;osc.type=good?'sine':'triangle';osc.frequency.setValueAtTime(hz,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.075,at+.018);gain.gain.exponentialRampToValueAtTime(.0001,at+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+.17)});setTimeout(()=>ctx.close(),500)}catch{}}
function vibrate(good){try{navigator.vibrate?.(good?17:[45,45,45])}catch{}}
function htmlHeader(){return `<div class="topbar"><div class="brand"><span class="brand-mark">🛡️</span><div><div class="brand-title">HÀNH TRÌNH CÔNG DÂN 7</div><div class="brand-sub">THCS Vĩnh An • 2026–2027</div></div></div><div class="top-actions"><button class="icon-btn" id="sound" title="Bật/tắt âm thanh" aria-label="Bật hoặc tắt âm thanh">${saved.muted?'🔇':'🔊'}</button></div></div>`}
function attachSound(){let s=$('sound');if(s)s.addEventListener('click',()=>{saved.muted=!saved.muted;save();s.textContent=saved.muted?'🔇':'🔊'})}
function home(){stopTimer();game=null;let s=saved;let masteredPct=s.mastered?`${s.mastered}%`:'0%';$('app').innerHTML=htmlHeader()+`
 <section class="hero"><div class="eyebrow">🎒 Ôn tập giữa học kì I</div><h1>Học vui.<br>Nhớ lâu.<br>Điểm cao!</h1><p>Thử sức mỗi ngày, tích lũy kiến thức và bứt phá!</p><div class="hero-pill">✨ Càng chơi càng tiến bộ</div><div class="hero-mascot"><span class="mascot-circle"></span><span class="mascot-face" role="img" aria-label="Linh vật cú mèo">🦉</span><span class="spark one">✦</span><span class="spark two">✳</span><span class="spark three">✦</span></div></section>
 <div class="stat-row"><div class="stat"><strong>${s.best.toLocaleString('vi-VN')}</strong><span>🏆 Điểm kỷ lục</span></div><div class="stat"><strong>${s.plays}</strong><span>🎮 Lượt thử sức</span></div><div class="stat"><strong>${masteredPct}</strong><span>🎯 Tỉ lệ tốt nhất</span></div></div>
 <div class="section-head"><h2>Chọn màn chơi</h2><small>4 chế độ ✨</small></div>
 <div class="modes">
 <button class="mode" data-mode="quick"><span class="mode-icon gold">⚡</span><span class="mode-text"><span class="mode-name">Đấu trường tốc độ</span><span class="mode-desc">10 câu ngẫu nhiên · 3 phút · 3 trái tim</span><span class="mode-foot">+100 điểm / câu đúng · Combo thưởng</span></span><span class="mode-arrow">›</span></button>
 <button class="mode" data-mode="mc"><span class="mode-icon violet">🧠</span><span class="mode-text"><span class="mode-name">Chinh phục kiến thức</span><span class="mode-desc">21 câu trắc nghiệm · Học theo đề cương</span><span class="mode-foot">Không giới hạn thời gian</span></span><span class="mode-arrow">›</span></button>
 <button class="mode" data-mode="tf"><span class="mode-icon mint">🔎</span><span class="mode-text"><span class="mode-name">Thám tử Đúng / Sai</span><span class="mode-desc">8 tình huống · Mỗi tình huống đủ 4 nhận định a–d</span><span class="mode-foot">Thực hành tình huống thực tế</span></span><span class="mode-arrow">›</span></button>
 <button class="mode" data-mode="essay"><span class="mode-icon rose">💬</span><span class="mode-text"><span class="mode-name">Bậc thầy ứng xử</span><span class="mode-desc">5 thẻ tự luận · Tự nghĩ rồi xem gợi ý</span><span class="mode-foot">Luyện diễn đạt và vận dụng</span></span><span class="mode-arrow">›</span></button>
 </div><div class="footnote"><details><summary>📚 Nguồn câu hỏi và lưu ý dành cho giáo viên</summary><p>Phát triển từ đề cương giữa học kì I GDCD 7 của Trường THCS Vĩnh An (năm học 2026–2027). Có biên tập lỗi chính tả, rút gọn một số câu để dễ đọc trên điện thoại. Đáp án và lời giải thích do trò chơi biên soạn, không phải đáp án chính thức của trường.</p><p>Không chấm điểm tự động 3 câu có phương án dễ gây tranh luận:</p><ul>${BANK.excluded.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>Tiến bộ được lưu trên thiết bị nếu trình duyệt cho phép. Khi bật hệ thống thống kê, tên hiển thị và kết quả sẽ được lưu trong bảng thống kê riêng của người quản lý.</p></details></div><div class="footer-brand">MADE FOR CURIOUS MINDS ✦ CÔNG DÂN 7 • CẬP NHẬT 2</div>`;
 attachSound();document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));}
function newGame(mode,questions){return {mode,questions,i:0,score:0,correct:0,wrong:[],answered:false,chosen:null,streak:0,maxStreak:0,hearts:3,halfUsed:false,hidden:[],remaining:180,started:Date.now(),prevCorrect:false}}
function buildCaseQuestions(items){
 const map=new Map();
 items.forEach(q=>{if(!map.has(q.case))map.set(q.case,{id:'CASE-'+q.case,type:'tf-case',case:q.case,caseTitle:q.caseTitle,topic:q.topic,sit:q.sit,items:[]});map.get(q.case).items.push(q)});
 return [...map.values()].sort((a,b)=>a.case-b.case).map(group=>({...group,items:group.items.sort((a,b)=>a.id.localeCompare(b.id))}));
}
function start(mode,override){if(!PlayStats.begin(mode))return;stopTimer();if(mode==='essay'){essayStep=0;essayDone=new Set();essayTexts={};essayRevealed=false;renderEssay();return}let qs;
 if(override)qs=override.some(q=>q.type==='tf')?buildCaseQuestions(BANK.tf.filter(q=>new Set(override.filter(x=>x.type==='tf').map(x=>x.case)).has(q.case))):override;
 else if(mode==='quick')qs=shuffle(BANK.mc).slice(0,10);
 else if(mode==='mc')qs=shuffle(BANK.mc);
 else if(mode==='tf')qs=buildCaseQuestions(BANK.tf);
 else return;
 game=newGame(mode,qs);renderQuiz();}
function modeName(m){return ({quick:'Đấu trường tốc độ',mc:'Chinh phục kiến thức',tf:'Thám tử Đúng / Sai',review:'Ôn tập câu sai'})[m]||m}
function stopTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function startTimer(){stopTimer();if(game?.mode!=='quick'||game.answered)return;let t0=Date.now();let base=game.remaining;ticker=setInterval(()=>{if(!game||game.mode!=='quick')return stopTimer();if(game.answered)return stopTimer();game.remaining=Math.max(0,base-Math.floor((Date.now()-t0)/1000));updateTimer();if(game.remaining<=0){stopTimer();finish('time')}},240)}
function updateTimer(){let e=$('timer');if(!e||!game)return;let t=game.remaining;e.textContent=`⏱ ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;e.classList.toggle('danger',t<=30)}
function topicClass(topic){if(topic==='Truyền thống quê hương')return 'orange';if(topic==='Quan tâm, chia sẻ')return 'purple';return ''}
function renderQuiz(){if(!game)return;stopTimer();let g=game,q=g.questions[g.i];if(!q)return finish('done');if(q.type==='tf-case')return renderCaseQuiz();let quick=g.mode==='quick',tf=q.type==='tf',n=g.questions.length;
 $('app').innerHTML=htmlHeader()+`
 <div class="game-top"><button class="back" id="exit" aria-label="Về trang chủ">‹</button><div class="game-label"><b>${esc(modeName(g.mode))}</b><span>${quick?'Thời gian và trái tim có hạn':'Cứ bình tĩnh, nghĩ thật kỹ nhé!'}</span></div><div class="game-points">⭐ <span id="points">${g.score}</span></div></div>
 <div class="game-status"><span class="counter">Câu ${g.i+1} / ${n}</span><span class="right-side">${quick?`<span class="hearts" aria-label="Còn ${g.hearts} trái tim">${'❤️'.repeat(g.hearts)}${'🤍'.repeat(3-g.hearts)}</span><span class="timer" id="timer">⏱ 3:00</span>`:`<span>✅ ${g.correct} đúng</span>`}</span></div>
 <div class="progress" role="progressbar" aria-valuenow="${g.i}" aria-valuemin="0" aria-valuemax="${n}"><div class="progress-fill" style="width:${g.i/n*100}%"></div></div>
 <section class="question-card"><span class="topic ${topicClass(q.topic)}">${topicKey[q.topic]||'📘'} ${esc(q.topic)}${tf?' · Đúng / Sai':''}</span>${tf?`<div class="situation"><strong>📖 Tình huống ${q.case}: ${esc(q.caseTitle)}</strong>${esc(q.sit)}</div>`:''}<h2>${tf?`Nhận định ${q.id.split('-')[1].toUpperCase()}: `:''}${esc(q.q)}</h2>
 <div class="answers" id="answers">${tf?`<button class="answer" data-answer="true"><span class="letter">Đ</span><span class="answer-text">Đúng</span><span class="mark"></span></button><button class="answer" data-answer="false"><span class="letter">S</span><span class="answer-text">Sai</span><span class="mark"></span></button>`:q.options.map((a,i)=>`<button class="answer" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span class="answer-text">${esc(a)}</span><span class="mark"></span></button>`).join('')}</div>
